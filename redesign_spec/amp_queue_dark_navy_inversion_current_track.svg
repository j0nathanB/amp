<title id="qt" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">amp Queue view with dark navy inversion for currently playing track</title>
<desc id="qd" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A mockup of amp's Queue view. A yellow brutalist header block reading Queue sits at the top. Below it, a small uppercase mono label reads Playing From followed by Kid A middot Radiohead. The currently playing track — Idioteque by Radiohead, duration five minutes nine seconds — is rendered as a full-width dark navy inversion row with white text, a muted blue-gray artist label, and three white equalizer bars indicating playback. Five regular upcoming tracks follow beneath, each in standard white-background rows with track number, title, artist, and duration, separated by hairline gray dividers.</desc>

