<title id="adt" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">amp Album Detail view for Kid A by Radiohead with currently playing track inverted</title>
<desc id="add" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A mockup of amp's Album Detail view. At the top, a 200 by 200 album artwork rendered as a stylized vinyl record on near black background with a 2 pixel stroke and offset indigo shadow. Below the art, the album title Kid A in large bold type, the artist Radiohead beneath it, and a mono metadata line reading 2000 middot 10 tracks middot 49 minutes 57 seconds. Next is an action row containing a wide green Play button with triangle icon and a smaller white Shuffle button with an X-shaped crossing icon, both with 2 pixel strokes and offset indigo shadows. Below the actions, a yellow brutalist block header reads Tracks. Then the track list: tracks 6 Optimistic and 7 In Limbo as regular white rows with track number, title, and duration. Track 8 Idioteque is rendered as a full-width dark navy inversion row with white text, three white equalizer bars, and white duration. Tracks 9 Morning Bell and 10 Motion Picture Soundtrack follow as regular white rows.</desc>

