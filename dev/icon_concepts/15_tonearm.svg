<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#2ECC40"/>
  <!-- platter shadow -->
  <circle cx="440" cy="560" r="380" fill="#000"/>
  <!-- platter -->
  <circle cx="412" cy="532" r="380" fill="#111" stroke="#000" stroke-width="18"/>
  <!-- grooves -->
  <circle cx="412" cy="532" r="340" fill="none" stroke="#333" stroke-width="3"/>
  <circle cx="412" cy="532" r="290" fill="none" stroke="#333" stroke-width="3"/>
  <circle cx="412" cy="532" r="240" fill="none" stroke="#333" stroke-width="3"/>
  <circle cx="412" cy="532" r="190" fill="none" stroke="#333" stroke-width="3"/>
  <!-- center label -->
  <circle cx="412" cy="532" r="130" fill="#FF2D55" stroke="#000" stroke-width="14"/>
  <circle cx="412" cy="532" r="14" fill="#000"/>
  <!-- tonearm base -->
  <circle cx="850" cy="180" r="70" fill="#FFD400" stroke="#000" stroke-width="18"/>
  <!-- arm -->
  <line x1="830" y1="200" x2="520" y2="600" stroke="#000" stroke-width="38" stroke-linecap="square"/>
  <line x1="830" y1="200" x2="520" y2="600" stroke="#FFD400" stroke-width="22"/>
  <!-- headshell -->
  <rect x="470" y="585" width="90" height="50" transform="rotate(-50 515 610)" fill="#FFD400" stroke="#000" stroke-width="14"/>
  <!-- counterweight -->
  <rect x="850" y="150" width="80" height="60" fill="#000"/>
</svg>
