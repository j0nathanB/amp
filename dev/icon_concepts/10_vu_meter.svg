<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#FF2D55"/>
  <!-- meter face shadow -->
  <rect x="130" y="200" width="800" height="600" rx="20" fill="#000"/>
  <!-- meter face -->
  <rect x="100" y="170" width="800" height="600" rx="20" fill="#FFD400" stroke="#000" stroke-width="20"/>
  <!-- arc scale -->
  <path d="M 180 720 A 320 320 0 0 1 820 720" fill="none" stroke="#000" stroke-width="16"/>
  <!-- red zone -->
  <path d="M 660 505 A 320 320 0 0 1 820 720" fill="none" stroke="#FF2D55" stroke-width="40"/>
  <!-- tick marks -->
  <g stroke="#000" stroke-width="12" stroke-linecap="square">
    <line x1="180" y1="720" x2="220" y2="700"/>
    <line x1="300" y1="560" x2="330" y2="585"/>
    <line x1="500" y1="400" x2="500" y2="440"/>
    <line x1="700" y1="560" x2="670" y2="585"/>
    <line x1="820" y1="720" x2="780" y2="700"/>
  </g>
  <!-- needle pivot -->
  <circle cx="500" cy="720" r="30" fill="#000"/>
  <!-- needle (in red zone) -->
  <line x1="500" y1="720" x2="780" y2="500" stroke="#000" stroke-width="18" stroke-linecap="square"/>
  <!-- VU label -->
  <text x="500" y="690" font-family="Impact, 'Arial Black', sans-serif" font-weight="900" font-size="72" fill="#000" text-anchor="middle">VU</text>
</svg>
