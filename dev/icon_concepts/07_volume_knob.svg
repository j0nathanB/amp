<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#FFD400"/>
  <!-- tick marks -->
  <g stroke="#000" stroke-width="16" stroke-linecap="square">
    <line x1="512" y1="110" x2="512" y2="170"/>
    <line x1="200" y1="300" x2="250" y2="340"/>
    <line x1="100" y1="560" x2="170" y2="560"/>
    <line x1="200" y1="820" x2="250" y2="780"/>
    <line x1="512" y1="1010" x2="512" y2="950"/>
    <line x1="824" y1="820" x2="774" y2="780"/>
    <line x1="924" y1="560" x2="854" y2="560"/>
    <line x1="824" y1="300" x2="774" y2="340"/>
  </g>
  <!-- knob shadow -->
  <circle cx="540" cy="590" r="300" fill="#000"/>
  <!-- knob -->
  <circle cx="512" cy="560" r="300" fill="#FF2D55" stroke="#000" stroke-width="24"/>
  <!-- indicator line pointing to "11" (past max) -->
  <line x1="512" y1="560" x2="780" y2="300" stroke="#000" stroke-width="40" stroke-linecap="square"/>
  <!-- 11 label -->
  <text x="870" y="240" font-family="Impact, 'Arial Black', sans-serif" font-weight="900" font-size="150" fill="#000" text-anchor="middle">11</text>
</svg>
