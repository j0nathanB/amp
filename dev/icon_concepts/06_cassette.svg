  <rect x="100" y="240" width="800" height="540" fill="#FFD400" stroke="#000" stroke-width="20"/>
  <!-- label -->
  <rect x="160" y="300" width="680" height="220" fill="#FFFFFF" stroke="#000" stroke-width="16"/>
  <text x="500" y="445" font-family="Impact, 'Arial Black', sans-serif" font-weight="900" font-size="140" fill="#000" text-anchor="middle">amp</text>
  <!-- reels -->
